<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Date Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fdf6f0;
      color: #2d2d2d;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 32px 16px;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    h1 {
      font-size: 1.8rem;
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 32px;
      font-size: 0.9rem;
    }

    #setup {
      background: white;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    }

    #setup h2 { margin-bottom: 20px; font-size: 1.1rem; }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #555;
      margin-bottom: 6px;
    }

    input[type="text"], input[type="date"], textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #e0e0e0;
      border-radius: 10px;
      font-size: 1rem;
      margin-bottom: 16px;
      background: #fafafa;
      transition: border-color 0.2s;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #f06292;
    }

    textarea { resize: vertical; min-height: 70px; font-family: inherit; }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.85; }

    .btn-primary { background: #f06292; color: white; }

    #app { display: none; }

    .turn-banner {
      background: linear-gradient(135deg, #f06292, #ba68c8);
      color: white;
      border-radius: 16px;
      padding: 20px 24px;
      margin-bottom: 24px;
      text-align: center;
    }

    .turn-banner .label { font-size: 0.8rem; opacity: 0.85; margin-bottom: 4px; }
    .turn-banner .name { font-size: 1.6rem; font-weight: 700; }

    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      margin-bottom: 24px;
    }

    .card h2 { margin-bottom: 18px; font-size: 1rem; color: #555; }

    .payer-toggle {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .payer-toggle button {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      font-size: 0.9rem;
      background: #f5f5f5;
      color: #555;
      border: 1.5px solid transparent;
      font-weight: 500;
    }

    .payer-toggle button.active {
      background: #fce4ec;
      color: #f06292;
      border-color: #f06292;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .history-header h2 { font-size: 1rem; color: #555; }

    .empty {
      text-align: center;
      color: #bbb;
      padding: 24px 0;
      font-size: 0.9rem;
    }

    .date-entry {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 14px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .date-entry:last-child { border-bottom: none; }

    .entry-left .entry-date {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .entry-left .entry-note {
      font-size: 0.82rem;
      color: #999;
      margin-top: 3px;
    }

    .entry-right { text-align: right; }

    .paid-badge {
      display: inline-block;
      background: #fce4ec;
      color: #f06292;
      border-radius: 20px;
      padding: 3px 12px;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .entry-delete {
      background: none;
      border: none;
      color: #ddd;
      font-size: 1rem;
      cursor: pointer;
      padding: 0;
      width: auto;
      margin-top: 4px;
      transition: color 0.2s;
    }

    .entry-delete:hover { color: #e57373; opacity: 1; }

    .settings-link {
      text-align: center;
      margin-top: 16px;
    }

    .settings-link button {
      background: none;
      border: none;
      color: #bbb;
      font-size: 0.8rem;
      width: auto;
      cursor: pointer;
      padding: 4px 8px;
      text-decoration: underline;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>💑 Date Tracker</h1>
  <p class="subtitle">Keep track of your dates &amp; who pays</p>

  <div id="setup">
    <h2>Who's in this relationship? 😊</h2>
    <label>Your name</label>
    <input type="text" id="name1" placeholder="e.g. Alex" />
    <label>Partner's name</label>
    <input type="text" id="name2" placeholder="e.g. Sam" />
    <button class="btn-primary" onclick="saveNames()">Let's go →</button>
  </div>

  <div id="app">
    <div class="turn-banner">
      <div class="label">Next to pay</div>
      <div class="name" id="next-payer">—</div>
    </div>

    <div class="card">
      <h2>Log a date</h2>
      <label>Date</label>
      <input type="date" id="log-date" />
      <label>Who paid?</label>
      <div class="payer-toggle" id="payer-toggle">
        <button id="btn-p1" onclick="selectPayer(0)"></button>
        <button id="btn-p2" onclick="selectPayer(1)"></button>
      </div>
      <label>Note <span style="font-weight:400;color:#bbb">(optional)</span></label>
      <textarea id="log-note" placeholder="e.g. Italian place downtown"></textarea>
      <button class="btn-primary" onclick="logDate()">Save date</button>
    </div>

    <div class="card">
      <div class="history-header">
        <h2>History</h2>
      </div>
      <div id="history-list"><p class="empty">No dates logged yet.</p></div>
    </div>

    <div class="settings-link">
      <button onclick="resetNames()">Change names</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'date-tracker-v1';

  function load() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch { return {}; }
  }

  function save(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  let selectedPayer = 0;

  function init() {
    const data = load();
    if (data.names && data.names.length === 2) {
      showApp(data);
    } else {
      document.getElementById('setup').style.display = 'block';
      document.getElementById('app').style.display = 'none';
    }
  }

  function saveNames() {
    const n1 = document.getElementById('name1').value.trim();
    const n2 = document.getElementById('name2').value.trim();
    if (!n1 || !n2) { alert('Please enter both names.'); return; }
    const data = load();
    data.names = [n1, n2];
    data.dates = data.dates || [];
    save(data);
    showApp(data);
  }

  function showApp(data) {
    document.getElementById('setup').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('log-date').value = today();
    document.getElementById('btn-p1').textContent = data.names[0];
    document.getElementById('btn-p2').textContent = data.names[1];

    const dates = data.dates || [];
    if (dates.length === 0) {
      selectedPayer = 0;
    } else {
      const lastPayerName = dates[dates.length - 1].paid;
      const lastPayerIdx = data.names.indexOf(lastPayerName);
      selectedPayer = lastPayerIdx === 0 ? 1 : 0;
    }
    selectPayer(selectedPayer);
    document.getElementById('next-payer').textContent = data.names[selectedPayer];
    renderHistory(data);
  }

  function selectPayer(idx) {
    selectedPayer = idx;
    document.getElementById('btn-p1').classList.toggle('active', idx === 0);
    document.getElementById('btn-p2').classList.toggle('active', idx === 1);
  }

  function logDate() {
    const dateVal = document.getElementById('log-date').value;
    const note = document.getElementById('log-note').value.trim();
    if (!dateVal) { alert('Please pick a date.'); return; }
    const data = load();
    data.dates = data.dates || [];
    data.dates.push({ date: dateVal, paid: data.names[selectedPayer], note: note });
    data.dates.sort((a, b) => b.date.localeCompare(a.date));
    save(data);
    document.getElementById('log-note').value = '';
    showApp(data);
  }

  function deleteEntry(idx) {
    if (!confirm('Delete this entry?')) return;
    const data = load();
    data.dates.splice(idx, 1);
    save(data);
    showApp(data);
  }

  function renderHistory(data) {
    const list = document.getElementById('history-list');
    const dates = data.dates || [];
    if (dates.length === 0) {
      list.innerHTML = '<p class="empty">No dates logged yet.</p>';
      return;
    }
    list.innerHTML = dates.map((entry, i) => `
      <div class="date-entry">
        <div class="entry-left">
          <div class="entry-date">${formatDate(entry.date)}</div>
          ${entry.note ? `<div class="entry-note">${escHtml(entry.note)}</div>` : ''}
        </div>
        <div class="entry-right">
          <span class="paid-badge">${escHtml(entry.paid)} paid</span><br/>
          <button class="entry-delete" onclick="deleteEntry(${i})" title="Delete">✕</button>
        </div>
      </div>
    `).join('');
  }

  function resetNames() {
    if (!confirm('Change names? Your date history will be kept.')) return;
    const data = load();
    const n1 = prompt('Your name:', data.names[0]);
    if (!n1) return;
    const n2 = prompt("Partner's name:", data.names[1]);
    if (!n2) return;
    data.dates = (data.dates || []).map(d => ({
      ...d,
      paid: d.paid === data.names[0] ? n1 : n2
    }));
    data.names = [n1, n2];
    save(data);
    showApp(data);
  }

  function today() {
    return new Date().toISOString().split('T')[0];
  }

  function formatDate(iso) {
    const [y, m, d] = iso.split('-');
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${months[+m - 1]} ${+d}, ${y}`;
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  init();
</script>
</body>
</html>
