<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tab Tracker - Giru Edition</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap');

:root {
  --bg-base:#F7F5F0;
  --bg-white:#FFFFFF;
  --bg-dark:#121212;
  --bg-accent:#E8E4D9;

  --text-dark:#121212;
  --text-light:#F7F5F0;
  --text-muted:#70706B;

  --border-dark:#121212;
  --border-light:rgba(18,18,18,0.1);

  --font-family:'Inter',sans-serif;
  --radius-lg:40px;
  --radius-pill:100px;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:var(--font-family);
  background:var(--bg-base);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

/* container */
.app-window{
  width:90vw;
  max-width:1200px;
  height:85vh;
  background:#fff;
  border:1px solid #121212;
  border-radius:var(--radius-lg);
  display:grid;
  grid-template-rows:auto 1fr;
  overflow:hidden;
}

/* top */
.top-bar{
  display:flex;
  justify-content:space-between;
  padding:1.5rem 2rem;
  border-bottom:1px solid var(--border-light);
  font-size:.7rem;
  letter-spacing:.1em;
}

/* grid */
.main-grid{
  display:grid;
  grid-template-columns:350px 1fr;
}

/* left */
.pane-status{
  background:var(--bg-accent);
  padding:2rem;
}

.hero-statement h2{
  font-size:3rem;
  margin-bottom:10px;
}

.sub-hero{
  border:1px solid var(--border-dark);
  padding:.4rem .8rem;
  border-radius:var(--radius-pill);
  display:inline-block;
  margin-bottom:20px;
}

.balance-list{
  list-style:none;
  margin-top:2rem;
}

.balance-item{
  display:flex;
  justify-content:space-between;
  padding:.8rem 0;
}

.balance-item.negative{
  font-weight:bold;
}

/* right */
.pane-history{
  display:flex;
  flex-direction:column;
}

.history-header{
  padding:1.5rem 2rem;
  border-bottom:1px solid var(--border-light);
}

.history-list{
  flex:1;
  overflow-y:auto;
  padding:1rem 2rem;
}

.ledger-item{
  display:grid;
  grid-template-columns:40px 1fr 100px 100px;
  padding:1rem 0;
  border-bottom:1px solid var(--border-light);
}

/* buttons */
.action-area{
  padding:1.5rem 2rem;
  display:flex;
  justify-content:space-between;
  border-top:1px solid var(--border-light);
}

button{
  padding:.8rem 1.5rem;
  border-radius:999px;
  border:1px solid #121212;
  background:#121212;
  color:#fff;
  cursor:pointer;
}

button.outline{
  background:transparent;
  color:#121212;
}
</style>
</head>

<body>

<div class="app-window">

  <div class="top-bar">
    <div>SYSTEM.LEDGER // V2</div>
    <div>GROUP: APARTMENT 4B</div>
  </div>

  <div class="main-grid">

    <!-- LEFT -->
    <div class="pane-status">
      <div class="hero-statement">
        <h2>MARCUS</h2>
        <div class="sub-hero">IS NEXT TO PAY</div>
        <p>Marcus has highest outstanding balance.</p>
      </div>

      <ul class="balance-list">
        <li class="balance-item negative"><span>Marcus</span><span>-$142.50</span></li>
        <li class="balance-item"><span>Sarah</span><span>+$85.00</span></li>
        <li class="balance-item"><span>David</span><span>+$57.50</span></li>
      </ul>
    </div>

    <!-- RIGHT -->
    <div class="pane-history">

      <div class="history-header">
        <h2>LEDGER</h2>
      </div>

      <div class="history-list">

        <div class="ledger-item">
          <div>01</div>
          <div>Internet Bill</div>
          <div>$89.99</div>
          <div>DAVID</div>
        </div>

        <div class="ledger-item">
          <div>02</div>
          <div>Groceries</div>
          <div>$124.50</div>
          <div>SARAH</div>
        </div>

        <div class="ledger-item">
          <div>03</div>
          <div>Uber</div>
          <div>$32.00</div>
          <div>MARCUS</div>
        </div>

      </div>

      <div class="action-area">
        <button class="outline">Settle Up</button>
        <button>Log Expense</button>
      </div>

    </div>

  </div>

</div>

</body>
</html>
